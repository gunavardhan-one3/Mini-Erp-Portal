databases:
  - name: erp-crm-db
    plan: free
    databaseName: erp_crm
    user: erp_user

services:
  - type: web
    name: erp-crm-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set manually once the frontend is deployed (restricts CORS to it).
      - key: FRONTEND_URL
        sync: false
